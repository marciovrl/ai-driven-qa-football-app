name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t football-backend-ci ./backend

      - name: Build frontend image
        run: docker build -t football-frontend-ci ./frontend

      - name: Lint backend
        run: docker run --rm football-backend-ci npm run lint

      - name: Lint frontend
        run: docker run --rm football-frontend-ci npm run lint

  test-api:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/test-api.yml

  test-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/test-e2e.yml
