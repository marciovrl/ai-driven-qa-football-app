name: Test E2E

on:
  workflow_call:
    inputs:
      suite:
        description: Which E2E suite to run (`smoke` or `all`)
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      suite:
        description: Which E2E suite to run
        type: choice
        options:
          - smoke
          - all
        default: smoke

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E tests (${{ inputs.suite }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start backend and frontend containers
        run: docker compose -f docker-compose.ci.yml up -d --build backend frontend

      - name: Wait for backend and frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy in time."
          exit 1

      - name: Run frontend e2e tests in Playwright container
        env:
          E2E_SUITE: ${{ inputs.suite }}
        run: |
          if [ "$E2E_SUITE" = "all" ]; then
            SCRIPT="test:e2e"
          else
            SCRIPT="test:e2e:smoke"
          fi
          docker compose -f docker-compose.ci.yml run --rm e2e sh -c "npm ci && npm run ${SCRIPT}"

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.ci.yml down --remove-orphans
